databases:
  - name: flying-j-db
    plan: free
    databaseName: flying_j_beef
    user: flying_j

services:
  - type: web
    name: flying-j-beef
    runtime: node
    repo: https://github.com/Outlaw1297/Flying-J-Premium-Beef
    branch: main
    rootDir: web
    plan: free
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flying-j-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        fromService:
          name: flying-j-beef
          type: web
          envVarKey: AUTH_SECRET
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXTAUTH_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRODUCT_TAX_CODE
        value: txcd_40060003
      - key: BUSINESS_ADDRESS_LINE1
        value: "10457 Lanesboro Rd"
      - key: BUSINESS_ADDRESS_LINE2
        sync: false
      - key: BUSINESS_CITY
        value: Scranton
      - key: BUSINESS_STATE
        value: ND
      - key: BUSINESS_ZIP
        value: "58653"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: NEXT_PUBLIC_CRISP_WEBSITE_ID
        sync: false
