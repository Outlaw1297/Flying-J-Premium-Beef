name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/outlaw1297/flying-j-premium-beef:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api --method PUT \
            "/user/packages/container/flying-j-premium-beef/visibility" \
            -f visibility=public \
            -H "Accept: application/vnd.github+json"
          status=$?
          if [ "$status" -ne 0 ]; then
            gh api --method PUT \
              "/users/Outlaw1297/packages/container/flying-j-premium-beef/visibility" \
              -f visibility=public \
              -H "Accept: application/vnd.github+json"
          fi

      - name: Confirm anonymous pull
        run: |
          docker logout ghcr.io || true
          docker pull ghcr.io/outlaw1297/flying-j-premium-beef:latest
