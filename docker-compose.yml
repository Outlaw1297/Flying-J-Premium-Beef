# Flying J Premium Beef — self-host with Docker Compose
#
# Quick start:
#   1. cp .env.docker.example .env
#   2. Edit .env (AUTH_SECRET, NEXTAUTH_URL, SEED_ADMIN_PASSWORD, Stripe keys…)
#   3. docker compose up -d --build
#   4. Open http://localhost:3000  (or your NEXTAUTH_URL)
#
# Seed runs only when SEED_ON_START=true. The default is false so a restart
# does not overwrite prices, inventory, or the admin password.
# Set it true for one boot to create the catalog and admin, then set it false.

name: flying-j-beef

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flying_j}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-flying_j_change_me}"
      POSTGRES_DB: ${POSTGRES_DB:-flying_j_beef}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flying_j} -d ${POSTGRES_DB:-flying_j_beef}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Uncomment to expose Postgres on the host (optional)
    # ports:
    #   - "5432:5432"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Next inlines these at `next build`; runtime env cannot change them.
        NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
        NEXT_PUBLIC_CRISP_WEBSITE_ID: "${NEXT_PUBLIC_CRISP_WEBSITE_ID:-}"
        NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # docker-entrypoint.sh percent-encodes these into DATABASE_URL.
      POSTGRES_USER: ${POSTGRES_USER:-flying_j}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-flying_j_change_me}"
      POSTGRES_DB: ${POSTGRES_DB:-flying_j_beef}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env (can match AUTH_SECRET)}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      SEED_ON_START: "${SEED_ON_START:-false}"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@flyingjbeef.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRODUCT_TAX_CODE: ${STRIPE_PRODUCT_TAX_CODE:-txcd_40040013}
      BUSINESS_ADDRESS_LINE1: ${BUSINESS_ADDRESS_LINE1:-10457 Lanesboro Rd}
      BUSINESS_ADDRESS_LINE2: ${BUSINESS_ADDRESS_LINE2:-}
      BUSINESS_CITY: ${BUSINESS_CITY:-Scranton}
      BUSINESS_STATE: ${BUSINESS_STATE:-ND}
      BUSINESS_ZIP: ${BUSINESS_ZIP:-58653}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Flying J Premium Beef <orders@flyingjbeef.com>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-orders@flyingjbeef.com}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      NEXT_PUBLIC_CRISP_WEBSITE_ID: ${NEXT_PUBLIC_CRISP_WEBSITE_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      # Persist product photo uploads across container rebuilds
      - uploads_data:/app/public/uploads

volumes:
  postgres_data:
  uploads_data:
