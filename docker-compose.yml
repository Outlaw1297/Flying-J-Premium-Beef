# Flying J Premium Beef — self-host with Docker Compose
#
# Zero-config (Portainer / mobile):
#   Deploy this compose file with no env vars required.
#   AUTH_SECRET + admin password are auto-generated on first boot
#   and persisted in the app_data volume. Check web container logs
#   for the admin password.
#
# Optional later:
#   NEXTAUTH_URL=https://your-domain.example
#   SEED_ON_START=false   (after first successful login)
#
# CLI with generated .env:
#   ./scripts/docker-init-env.sh && docker compose up -d --build

name: flying-j-beef

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flying_j}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flying_j_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-flying_j_beef}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flying_j} -d ${POSTGRES_DB:-flying_j_beef}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Uncomment to expose Postgres on the host (optional)
    # ports:
    #   - "5432:5432"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flying_j}:${POSTGRES_PASSWORD:-flying_j_change_me}@db:5432/${POSTGRES_DB:-flying_j_beef}?schema=public
      # Optional — auto-generated + persisted in app_data if left blank
      AUTH_SECRET: ${AUTH_SECRET:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@flyingjbeef.com}
      # Optional — auto-generated on first seed if left blank (printed in logs)
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRODUCT_TAX_CODE: ${STRIPE_PRODUCT_TAX_CODE:-txcd_40040013}
      BUSINESS_ADDRESS_LINE1: ${BUSINESS_ADDRESS_LINE1:-10457 Lanesboro Rd}
      BUSINESS_ADDRESS_LINE2: ${BUSINESS_ADDRESS_LINE2:-}
      BUSINESS_CITY: ${BUSINESS_CITY:-Scranton}
      BUSINESS_STATE: ${BUSINESS_STATE:-ND}
      BUSINESS_ZIP: ${BUSINESS_ZIP:-58653}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Flying J Premium Beef <orders@flyingjbeef.com>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-orders@flyingjbeef.com}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      NEXT_PUBLIC_CRISP_WEBSITE_ID: ${NEXT_PUBLIC_CRISP_WEBSITE_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      # Persist product photo uploads across container rebuilds
      - uploads_data:/app/public/uploads
      # Persist auto-generated AUTH_SECRET + admin password
      - app_data:/app/data

volumes:
  postgres_data:
  uploads_data:
  app_data:
