# Flying J Premium Beef — self-host with Docker Compose
#
# Quick start (CLI):
#   1. ./scripts/docker-init-env.sh
#   2. Edit .env (at least NEXTAUTH_URL)
#   3. docker compose up -d --build
#
# Portainer / stack UI:
#   Add these environment variables before deploy (required):
#     AUTH_SECRET, NEXTAUTH_SECRET  (same value, from: openssl rand -base64 32)
#     SEED_ADMIN_PASSWORD           (your admin password)
#     POSTGRES_PASSWORD             (database password)
#     NEXTAUTH_URL                  (public site URL, e.g. https://beef.example.com)
#
# First boot creates the admin when SEED_ON_START=true and SEED_ADMIN_PASSWORD is set.
# After that, set SEED_ON_START=false so restarts do not re-run seed side effects.

name: flying-j-beef

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flying_j}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flying_j_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-flying_j_beef}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flying_j} -d ${POSTGRES_DB:-flying_j_beef}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Uncomment to expose Postgres on the host (optional)
    # ports:
    #   - "5432:5432"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flying_j}:${POSTGRES_PASSWORD:-flying_j_change_me}@db:5432/${POSTGRES_DB:-flying_j_beef}?schema=public
      # Required — set in .env or Portainer stack env (openssl rand -base64 32)
      AUTH_SECRET: ${AUTH_SECRET:-}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@flyingjbeef.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRODUCT_TAX_CODE: ${STRIPE_PRODUCT_TAX_CODE:-txcd_40040013}
      BUSINESS_ADDRESS_LINE1: ${BUSINESS_ADDRESS_LINE1:-10457 Lanesboro Rd}
      BUSINESS_ADDRESS_LINE2: ${BUSINESS_ADDRESS_LINE2:-}
      BUSINESS_CITY: ${BUSINESS_CITY:-Scranton}
      BUSINESS_STATE: ${BUSINESS_STATE:-ND}
      BUSINESS_ZIP: ${BUSINESS_ZIP:-58653}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Flying J Premium Beef <orders@flyingjbeef.com>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-orders@flyingjbeef.com}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      NEXT_PUBLIC_CRISP_WEBSITE_ID: ${NEXT_PUBLIC_CRISP_WEBSITE_ID:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      # Persist product photo uploads across container rebuilds
      - uploads_data:/app/public/uploads

volumes:
  postgres_data:
  uploads_data:
