# Flying J Premium Beef — self-host with Docker Compose / Portainer
#
# Portainer: deploy from the Git repository (not a pasted compose file).
#   URL: https://github.com/Outlaw1297/Flying-J-Premium-Beef
#   Compose path: docker-compose.yml
#   Branch: main
#   No environment variables required.
#
# The web image is built on your server from this repo. Do not pull
# ghcr.io — that package is private and Portainer will get "unauthorized".
#
# After deploy, open the web container logs for the admin password.
# Optional later: NEXTAUTH_URL=https://your-domain.example

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-flying_j}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-flying_j_change_me}"
      POSTGRES_DB: "${POSTGRES_DB:-flying_j_beef}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flying_j -d flying_j_beef"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-flying_j}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-flying_j_change_me}"
      POSTGRES_DB: "${POSTGRES_DB:-flying_j_beef}"
      AUTH_SECRET: "${AUTH_SECRET:-}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      AUTH_TRUST_HOST: "${AUTH_TRUST_HOST:-true}"
      SEED_ON_START: "${SEED_ON_START:-true}"
      SEED_ADMIN_EMAIL: "${SEED_ADMIN_EMAIL:-admin@flyingjbeef.com}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRODUCT_TAX_CODE: "${STRIPE_PRODUCT_TAX_CODE:-txcd_40040013}"
      BUSINESS_ADDRESS_LINE1: "${BUSINESS_ADDRESS_LINE1:-10457 Lanesboro Rd}"
      BUSINESS_ADDRESS_LINE2: "${BUSINESS_ADDRESS_LINE2:-}"
      BUSINESS_CITY: "${BUSINESS_CITY:-Scranton}"
      BUSINESS_STATE: "${BUSINESS_STATE:-ND}"
      BUSINESS_ZIP: "${BUSINESS_ZIP:-58653}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      EMAIL_API_KEY: "${EMAIL_API_KEY:-}"
      EMAIL_FROM: "${EMAIL_FROM:-orders@flyingjbeef.com}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-orders@flyingjbeef.com}"
      SUPPORT_EMAIL: "${SUPPORT_EMAIL:-}"
      NEXT_PUBLIC_CRISP_WEBSITE_ID: "${NEXT_PUBLIC_CRISP_WEBSITE_ID:-}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      NEXT_PUBLIC_SENTRY_DSN: "${NEXT_PUBLIC_SENTRY_DSN:-}"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    volumes:
      - uploads_data:/app/public/uploads
      - app_data:/app/data

volumes:
  postgres_data:
  uploads_data:
  app_data:
